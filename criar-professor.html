<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta de professor | No Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#0A2148">
<link rel="icon" href="assets/logo-er.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=8">
<link rel="stylesheet" href="css/auth.css?v=1">
<script>
const SUPABASE_URL = 'https://znkxhacjuejmxhgcaqvz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ULAmkcVfbsAzJ6tRCQJarQ_WGMbMaTo';
const BASE_URL = 'https://profellysson.com.br';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function setMsg(text, type='success') {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}
</script>

</head>
<body>
    <div class="auth-wrapper">
        <div class="brand">
            <h1>No Controle</h1>
            <p>Solicitação de acesso de professor.</p>
        </div>
        <div class="card">
            <div id="formProfessor" style="display:block;">
                <h2>Solicitar acesso de professor</h2>
                <p class="sub">Crie sua conta e confirme o e-mail. O acesso de professor é liberado manualmente pelo administrador; até lá a conta funciona como a de um aluno.</p>

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome completo">

                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" placeholder="você@exemplo.com">

                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="new-password" placeholder="Crie uma senha">

                <label for="senha2">Confirmar senha</label>
                <input type="password" id="senha2" autocomplete="new-password" placeholder="Repita a senha">

                <button id="btnCriarProfessor" type="button">Criar conta e solicitar acesso</button>
                <div id="msg2" class="msg"></div>
            </div>

            <a class="back-link" href="login.html">Voltar ao login</a>
        </div>
    </div>

<script>
function setMsg2(text, type='success') {
    const el = document.getElementById('msg2');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}

// Não existe mais código de acesso: ele vivia no JavaScript e qualquer
// visitante podia lê-lo. O papel de professor é definido só no banco (trigger
// impedir_auto_promocao): toda conta criada pelo navegador nasce como aluno.
// O pedido fica registrado nos metadados do usuário para o administrador.
document.getElementById('btnCriarProfessor').addEventListener('click', async () => {
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('senha').value;
    const password2 = document.getElementById('senha2').value;

    if (!nome || !email || !password || !password2) {
        setMsg2('Preencha todos os campos.', 'error');
        return;
    }
    if (password.length < 6) {
        setMsg2('Use uma senha com pelo menos 6 caracteres.', 'error');
        return;
    }
    if (password !== password2) {
        setMsg2('As senhas não coincidem.', 'error');
        return;
    }

    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            data: { nome, solicitou_professor: true },
            emailRedirectTo: BASE_URL + '/login.html'
        }
    });

    if (signUpError) {
        setMsg2(signUpError.message || String(signUpError), 'error');
        return;
    }

    setMsg2('Conta criada. Confirme seu e-mail e avise o administrador para liberar o acesso de professor.');
});
</script>
</body>
</html>
