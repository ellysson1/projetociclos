<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta de professor | No Controle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#0A2148">
<link rel="icon" href="assets/logo-er.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=8">
<link rel="stylesheet" href="css/auth.css?v=1">
<script>
const SUPABASE_URL = 'https://znkxhacjuejmxhgcaqvz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ULAmkcVfbsAzJ6tRCQJarQ_WGMbMaTo';
const BASE_URL = 'https://profellysson.com.br';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const CODIGO_PROFESSOR = 'prof2026@ciclo';

function setMsg(text, type='success') {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}
</script>

</head>
<body>
    <div class="auth-wrapper">
        <div class="brand">
            <h1>No Controle</h1>
            <p>Cadastro restrito a professores.</p>
        </div>
        <div class="card">
            <div id="formCodigo">
                <h2>Acesso restrito</h2>
                <p class="sub">Informe o código de acesso para cadastrar uma conta de professor.</p>

                <label for="codigo">Código de acesso</label>
                <input type="password" id="codigo" placeholder="Digite o código">

                <button id="btnValidarCodigo" type="button">Validar</button>
                <div id="msg" class="msg"></div>
            </div>

            <div id="formProfessor">
                <h2>Criar conta de professor</h2>
                <p class="sub">Depois do cadastro, confirme seu e-mail antes de entrar.</p>

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome completo">

                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" placeholder="você@exemplo.com">

                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="new-password" placeholder="Crie uma senha">

                <label for="senha2">Confirmar senha</label>
                <input type="password" id="senha2" autocomplete="new-password" placeholder="Repita a senha">

                <button id="btnCriarProfessor" type="button">Criar conta</button>
                <div id="msg2" class="msg"></div>
            </div>

            <a class="back-link" href="login.html">Voltar ao login</a>
        </div>
    </div>

<script>
function setMsg2(text, type='success') {
    const el = document.getElementById('msg2');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}

// ATENÇÃO: este código NÃO é um segredo — ele vive no JavaScript do
// navegador e é legível por qualquer visitante no DevTools. Serve apenas
// como atrito de UX. A barreira real é a trigger `impedir_auto_promocao`
// (sql/fase6_seguranca.sql): toda conta criada pelo navegador nasce como
// 'aluno' e o role só é elevado via service_role (painel do Supabase).
document.getElementById('btnValidarCodigo').addEventListener('click', () => {
    const codigo = document.getElementById('codigo').value.trim();
    if (codigo === CODIGO_PROFESSOR) {
        document.getElementById('formCodigo').style.display = 'none';
        document.getElementById('formProfessor').style.display = 'block';
    } else {
        setMsg('Código inválido.', 'error');
    }
});

document.getElementById('btnCriarProfessor').addEventListener('click', async () => {
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('senha').value;
    const password2 = document.getElementById('senha2').value;

    if (!nome || !email || !password || !password2) {
        setMsg2('Preencha todos os campos.', 'error');
        return;
    }
    if (password.length < 6) {
        setMsg2('Use uma senha com pelo menos 6 caracteres.', 'error');
        return;
    }
    if (password !== password2) {
        setMsg2('As senhas não coincidem.', 'error');
        return;
    }

    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            data: { nome, role: 'professor' },
            emailRedirectTo: BASE_URL + '/login.html'
        }
    });

    if (signUpError) {
        setMsg2(signUpError.message || String(signUpError), 'error');
        return;
    }

    setMsg2('Conta de professor criada com sucesso! Verifique seu e-mail para confirmar o cadastro.');
});
</script>
</body>
</html>
