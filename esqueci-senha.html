<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha | No Controle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#0A2148">
<link rel="icon" href="assets/logo-er.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=8">
<link rel="stylesheet" href="css/auth.css?v=1">
<script>
const SUPABASE_URL = 'https://znkxhacjuejmxhgcaqvz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ULAmkcVfbsAzJ6tRCQJarQ_WGMbMaTo';
const BASE_URL = 'https://profellysson.com.br';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function setMsg(text, type='success') {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}

function normalizeError(error) {
    if (!error) return 'Erro desconhecido.';
    return error.message || String(error);
}
</script>

</head>
<body>
    <div class="auth-wrapper">
        <div class="brand">
            <h1>No Controle</h1>
            <p>Enviamos por e-mail um link para você criar uma nova senha.</p>
        </div>
        <div class="card">
            <h2>Esqueci minha senha</h2>
            <p class="sub">Informe o e-mail usado no cadastro.</p>

            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" placeholder="você@exemplo.com">

            <button id="btnEnviar" type="button">Enviar o link</button>
            <div id="msg" class="msg"></div>

            <div class="links">
                <a href="login.html">Voltar para login</a>
                <a href="criar-conta.html">Criar conta</a>
            </div>

            <div class="small">
                O link recebido por e-mail abrirá a página de redefinição deste site.
            </div>
        </div>
    </div>

<script>
document.getElementById('btnEnviar').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) {
        setMsg('Informe seu e-mail.', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: BASE_URL + '/redefinir-senha.html'
    });

    if (error) {
        setMsg(normalizeError(error), 'error');
        return;
    }

    setMsg('Se esse e-mail existir na base, o link de redefinição foi enviado.');
});
</script>
</body>
</html>
