<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | No Controle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#0A2148">
<link rel="icon" href="assets/logo-er.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=8">
<link rel="stylesheet" href="css/auth.css?v=1">
<script>
const SUPABASE_URL = 'https://znkxhacjuejmxhgcaqvz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ULAmkcVfbsAzJ6tRCQJarQ_WGMbMaTo';
const BASE_URL = 'https://profellysson.com.br';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function setMsg(text, type='success') {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}

function normalizeError(error) {
    if (!error) return 'Erro desconhecido.';
    return error.message || String(error);
}
</script>

</head>
<body>
    <div class="auth-wrapper">
        <div class="brand">
            <h1>No Controle</h1>
            <p>Crie sua conta e monte o primeiro ciclo em poucos minutos.</p>
        </div>
        <div class="card">
            <h2>Criar conta</h2>
            <p class="sub">Depois do cadastro, confirme seu e-mail antes do primeiro login.</p>

            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" placeholder="você@exemplo.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="new-password" placeholder="Crie uma senha">

            <label for="senha2">Confirmar senha</label>
            <input type="password" id="senha2" autocomplete="new-password" placeholder="Repita a senha">

            <button id="btnCriarConta" type="button">Criar conta</button>
            <div id="msg" class="msg"></div>

            <div class="links">
                <a href="login.html">Já tenho conta</a>
                <a href="esqueci-senha.html">Esqueci minha senha</a>
            </div>

            <div class="divider"></div>
            <a class="back-link" href="index.html">Voltar para o app</a>
        </div>
    </div>

<script>
document.getElementById('btnCriarConta').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('senha').value;
    const password2 = document.getElementById('senha2').value;

    if (!email || !password || !password2) {
        setMsg('Preencha todos os campos.', 'error');
        return;
    }
    if (password.length < 6) {
        setMsg('Use uma senha com pelo menos 6 caracteres.', 'error');
        return;
    }
    if (password !== password2) {
        setMsg('As senhas não coincidem.', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            emailRedirectTo: BASE_URL + '/login.html'
        }
    });

    if (error) {
        setMsg(normalizeError(error), 'error');
        return;
    }

    setMsg('Conta criada. Verifique seu e-mail para confirmar o cadastro antes de entrar.');
});

document.addEventListener('DOMContentLoaded', async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
        window.location.href = BASE_URL + '/';
    }
});
</script>
</body>
</html>
