<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | No Controle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#0A2148">
<link rel="icon" href="assets/logo-er.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=8">
<link rel="stylesheet" href="css/auth.css?v=1">
<script>
const SUPABASE_URL = 'https://znkxhacjuejmxhgcaqvz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ULAmkcVfbsAzJ6tRCQJarQ_WGMbMaTo';
const BASE_URL = 'https://profellysson.com.br';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function setMsg(text, type='success') {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + type;
}

function normalizeError(error) {
    if (!error) return 'Erro desconhecido.';
    return error.message || String(error);
}
</script>

</head>
<body>
    <div class="auth-wrapper">
        <div class="brand">
            <h1>No Controle</h1>
            <p>Seu ciclo, seu edital e seu desempenho, do jeito que você deixou.</p>
        </div>
        <div class="card">
            <h2>Entrar</h2>
            <p class="sub">Use seu e-mail e sua senha.</p>

            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" placeholder="você@exemplo.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha">

            <button id="btnEntrar" type="button">Entrar</button>
            <div id="msg" class="msg"></div>

            <div class="links">
                <a href="criar-conta.html">Criar conta</a>
                <a href="esqueci-senha.html">Esqueci minha senha</a>
            </div>

            <div class="divider"></div>
            <a class="back-link" href="index.html">Voltar para o app</a>
        </div>
    </div>

<script>
document.getElementById('btnEntrar').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('senha').value;

    if (!email || !password) {
        setMsg('Informe e-mail e senha.', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        setMsg(normalizeError(error), 'error');
        return;
    }

    setMsg('Login realizado com sucesso. Redirecionando...');
    window.location.href = BASE_URL + '/';
});

document.addEventListener('DOMContentLoaded', async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
        window.location.href = BASE_URL + '/';
    }
});
</script>
</body>
</html>
